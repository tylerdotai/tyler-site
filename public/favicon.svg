  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#00B8FF" stroke-width="2"/>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#00B8FF" stroke-width="1"/>
  <text x="16" y="23" font-family="Arial Black, Impact, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#00B8FF">T</text>
</svg>
